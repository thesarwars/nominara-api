;; STORY-010 — checked-in pgBouncer config, shared verbatim by docker-compose
;; and test/support/pgbouncer-fixture.ts (the test fixture copies this exact
;; file into the container and overrides ONLY the [databases] host/dbname and
;; default_pool_size, then asserts pool_mode survived unchanged — so the
;; interleaved-tenant test in test/integration/pgbouncer-transaction-mode.spec.ts
;; is exercising the SHIPPED config, not a test-only stand-in for it).
;;
;; Image floor: pgBouncer >= 1.25.2 (system-architecture.md's "Pooling" row —
;; a stated security floor). docker-compose.yml pins edoburu/pgbouncer:v1.25.2-p0.

[databases]
nominara = host=postgres port=5432 dbname=nominara

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432

;; scram-sha-256 matches Postgres's own auth_type — see userlist.txt for the
;; loud LOCAL-DEVELOPMENT-ONLY disclosure of gap G-2 (production uses
;; auth_user/auth_query against Secrets Manager instead of this file).
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; Lets the config test (and an operator) run SHOW CONFIG / SHOW POOLS
;; against pgBouncer's virtual admin console.
admin_users = nominara

;; node-postgres always sends extra_float_digits on startup; pgBouncer must
;; be told to ignore it or every client using node-postgres fails to connect
;; in transaction/statement pooling mode.
ignore_startup_parameters = extra_float_digits

;; Transaction pooling is the ONLY safe mode here, and the reason is
;; specific, not a style preference. Statement mode silently breaks tenant
;; isolation: a transaction-scoped SET LOCAL (set_config(..., true)) cannot
;; survive a statement-mode server-connection handoff, so a query can return
;; another tenant's rows without raising anything. Session mode is safe but
;; wastes connections by holding one server connection per client for its
;; entire lifetime. Every tenant query in this system routes through this
;; one setting (security-and-tenancy.md §4), which is exactly why the next
;; person who sees idle connections and reaches for session mode, or worse
;; statement mode, must not: it would silently reintroduce the leak
;; test/integration/pgbouncer-transaction-mode.spec.ts exists to catch.
pool_mode = transaction

default_pool_size = 20

;; server_reset_query is kept at pgBouncer's own default (DISCARD ALL) —
;; post-review fix (item 13): it was previously emptied out here, which
;; removed a real safety net without being necessary for anything this file
;; actually relies on. The leak this config's negative control test proves
;; is caused by server_reset_query_always = 0 below, NOT by this query's
;; content — with pool_mode = transaction and server_reset_query_always = 0,
;; server_reset_query never runs during normal pooled operation anyway, so
;; leaving it at DISCARD ALL costs nothing today. What it buys: if someone
;; later mistakenly flips pool_mode to session, DISCARD ALL still resets any
;; stray session-level state between clients — a defense this file should
;; not have thrown away just because the negative control doesn't need it.
server_reset_query = DISCARD ALL

;; server_reset_query_always is intentionally 0 — its own comment, separate
;; from pool_mode's above, because it is a second, independent way to defeat
;; the same isolation property. Setting it to 1 would issue DISCARD ALL on
;; every transaction handoff, which WOULD reset any stray session-level SET
;; between tenants — but that means it would also paper over the exact
;; defect (a session-level SET instead of set_config(..., true)) that this
;; story's interleaved-tenant test and its negative control exist to catch.
;; A real leak must be visible, not silently mopped up by the pooler.
server_reset_query_always = 0
