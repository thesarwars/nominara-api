# Single-package repo, but pnpm 11 requires this file to declare `packages`
# once it exists at all — otherwise every command exits with "packages field
# missing or empty" before it runs anything.
packages:
  - "."

# pnpm 11 no longer reads the `pnpm` field in package.json — it warns
# "The following keys were ignored" on every command — so the fastify
# override lives here instead. Without it, fastify 5.11.3 and 5.12.0 both
# resolve, @fastify/cookie and @nestjs/platform-fastify disagree on the
# FastifyInstance type, and `pnpm typecheck` fails at
# src/api/register-cookies.ts. system-architecture.md §11 pins the floor.
overrides:
  fastify: 5.12.2
  # Batch 18 (owner decision 108(c)): transitive packages with HIGH advisories that `pnpm scan:deps` blocks on. Each is the
  # minimal patched version; drop an entry when its parent resolves a patched version on its own.
  engine.io: 6.6.10
  fast-uri: 3.1.7
  "@grpc/grpc-js": 1.14.5

# pnpm 11 runs a dependency-status check before every script and exits 1
# with ERR_PNPM_IGNORED_BUILDS while any build script is unapproved — which
# made EVERY `pnpm <script>` in this repo fail before it ran. These are the
# decisions `pnpm approve-builds` writes.
#
# esbuild alone needs its install script: it fetches the platform binary
# vitest's transform pipeline runs on. The others are optional native
# accelerators pulled in transitively (testcontainers/dockerode, and now
# bullmq/ioredis's msgpackr) and degrade gracefully to their JS paths.
allowBuilds:
  cpu-features: false
  esbuild: true
  msgpackr-extract: false
  protobufjs: false
  ssh2: false
