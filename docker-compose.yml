# pgBouncer joins this file in STORY-010 (database roles & pgBouncer wiring).
#
# Valkey arrives as TWO instances, not one — system-architecture.md §11. The
# CACHE instance is here (STORY-025: token buckets, idempotency records,
# locks, memoisation, pub/sub) with allkeys-lru and no persistence. STORY-031
# adds token-bucket/breaker-state use of this SAME cache instance — no third
# instance. The QUEUE instance joins in STORY-030 (below, `valkey`) with
# noeviction and persistence on, holding BullMQ's queues. The split is not
# tidiness: evicting a queued job under memory pressure is silent data loss,
# and refusing to evict a cache is an outage. One instance cannot have both
# policies.
services:
  # STORY-030 — the QUEUE instance. Separate host port from valkey-cache's
  # VALKEY_PORT below (both default container-side to 6379, but two services
  # cannot both bind host port 6379) — override with VALKEY_QUEUE_PORT if it
  # collides with something else already running.
  valkey:
    image: valkey/valkey:9.1
    command: valkey-server --maxmemory-policy noeviction --appendonly yes
    ports:
      - "${VALKEY_QUEUE_PORT:-6380}:6379"
    volumes:
      - nominara-valkey-data:/data

  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: nominara
      POSTGRES_PASSWORD: nominara
      POSTGRES_DB: nominara
    ports:
      # Host port overridable: 5432 is the most commonly already-occupied port
      # on a developer machine, and a hard-coded mapping makes the whole stack
      # refuse to start because of something unrelated. The CONTAINER port
      # never moves — service-to-service URLs do not depend on this.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PG18's image wants a single mount at /var/lib/postgresql (data lands
      # in a version-specific subdirectory) rather than /var/lib/postgresql/data
      # directly — mounting the old path makes the container refuse to start.
      - nominara-postgres-data:/var/lib/postgresql
    # Without this, `depends_on` only waits for the CONTAINER, not for Postgres
    # to accept connections — so migrate would race the database and fail on a
    # cold start roughly every time.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nominara -d nominara"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Transaction-mode pooler in front of Postgres. Config lives entirely in
  # docker/pgbouncer/{pgbouncer.ini,userlist.txt} — not compose env vars — so
  # the exact same files are used here and by
  # test/integration/pgbouncer-transaction-mode.spec.ts's testcontainers
  # fixture. DATABASE_URL (port 5432, direct) stays the migration/DDL
  # connection and never routes through this pooler; DATABASE_URL_POOLED
  # (port 6432, see .env.example) is what application code uses.
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0 # >= 1.25.2 is a stated security floor, system-architecture.md
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./docker/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "${PGBOUNCER_PORT:-6432}:5432"

  # STORY-025 — the CACHE instance. allkeys-lru because every key here is
  # reconstructible: a token bucket evicted early grants a little extra
  # capacity, an idempotency record evicted early turns a replay into a
  # re-execution. Both are degradations, not corruption, which is exactly
  # what makes eviction the right policy for this instance and the wrong one
  # for the queue.
  #
  # No volume, deliberately. Persistence here would preserve state that is
  # meant to expire, and would make a local restart behave differently from
  # the managed cache this stands in for.
  valkey-cache:
    image: valkey/valkey:8.1-alpine
    command:
      - valkey-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Group C item 3 - object storage (KAD-08), S3-compatible, development only. Production uses AWS S3 and differs
  # only in STORAGE_ENDPOINT (unset) and the credentials (IAM role). S3 ONLY: LocalStack loads nothing else.
  #
  # PINNED to 4.14.0 AND by digest (the multi-arch index digest), deliberately NOT `latest`: LocalStack moved to date-versioned (2026.x) images that, per its own
  # announcement, need an auth token; 4.14.0 (Feb 2026) is the last 4.x release, which runs without one. Moving past
  # it is a licensing decision, not a version bump.
  #
  # Host port 4566 (LocalStack's own edge port; overridable with LOCALSTACK_PORT). It collides with nothing in this
  # file or the documented 3000/3001/3199/4000/55432/6380/6379/6432/5432. No volume: a local bucket is disposable and
  # persistence would make a restart behave differently from a fresh clone. The init script creates the two buckets
  # when LocalStack reports ready.
  localstack:
    image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    # Opt-in: `docker compose up -d` does not pull this image or bind 4566. Start it with
    # `docker compose --profile storage up -d localstack` (or COMPOSE_PROFILES=storage).
    profiles: ["storage"]
    environment:
      SERVICES: s3
      DEBUG: "0"
      # Validate presigned-URL signatures and expiry like AWS does (LocalStack skips both by default).
      S3_SKIP_SIGNATURE_VALIDATION: "0"
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - ./docker/localstack/init-buckets.sh:/etc/localstack/init/ready.d/10-buckets.sh:ro
    healthcheck:
      # `ready` only after the init scripts have run, so a healthy LocalStack always has its buckets.
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---- application ---------------------------------------------------------
  #
  # Every service below overrides the FOUR connection URLs from .env, because
  # .env's values are `localhost` — correct when you run the app on the host,
  # wrong inside the network where the hostnames are the service names. Note
  # pgbouncer is reached on 5432, its CONTAINER port; 6432 is only the host
  # mapping.
  #
  # STORY-120 review: this said "three" and listed three while STORY-030 had
  # already added a fourth, QUEUE_REDIS_URL. The api container therefore
  # inherited `redis://localhost:6380` — its OWN localhost, where nothing
  # listens — and because src/lib/queue/connection.ts sets
  # `maxRetriesPerRequest: null` (BullMQ's own requirement), the resulting
  # read never rejects and never resolves. /health/ready hung forever rather
  # than failing, which no probe could report and no test covered.
  #
  # Two one-shot services run before the app, in order, each waiting for the
  # previous to EXIT SUCCESSFULLY rather than merely to start.

  migrate:
    build: .
    image: nominara-api
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://nominara:nominara@postgres:5432/nominara
    # Direct to Postgres, never through the pooler: migrations need a real
    # session-scoped connection, which transaction-mode pooling cannot give.
    command: ["node", "dist/src/db/migrate.js"]
    restart: "no"

  dev-credentials:
    build: .
    image: nominara-api
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://nominara:nominara@postgres:5432/nominara
    # Migration 0005 creates the runtime roles and deliberately sets NO
    # password. Without this step `nominara_app` cannot authenticate and
    # DATABASE_URL_POOLED fails — the roles exist but cannot log in.
    # LOCAL ONLY: production issues these through Secrets Manager (NFR-SEC-16).
    command: ["node", "dist/src/db/dev-credentials.js"]
    restart: "no"

  api:
    build: .
    image: nominara-api
    depends_on:
      dev-credentials:
        condition: service_completed_successfully
      valkey-cache:
        condition: service_healthy
      # STORY-120 review — DATABASE_URL_POOLED points at pgbouncer, so this
      # service cannot reach its database without it, yet it did not depend
      # on it: `docker compose up -d api` left the pooler down and the API
      # answering nothing. It went unnoticed because the old liveness
      # healthcheck reported HEALTHY in exactly that state, which is this
      # story's whole point. `service_started` rather than `service_healthy`
      # because pgbouncer declares no healthcheck; the readiness probe below
      # is what actually verifies the connection works.
      pgbouncer:
        condition: service_started
      # Same gap, same cause: /health/ready reads queue depth, so the QUEUE
      # instance is a startup dependency of a service whose readiness gate
      # asks about it.
      valkey:
        condition: service_started
    env_file:
      - .env
    environment:
      # NOT `test`. That value selects the per-process in-memory cache, which
      # now refuses to start outside a test runner: with more than one replica
      # it gives each its own idempotency store, so two requests carrying one
      # Idempotency-Key both execute.
      NODE_ENV: development
      PORT: "4000"
      DATABASE_URL: postgres://nominara:nominara@postgres:5432/nominara
      DATABASE_URL_POOLED: postgres://nominara_app:nominara_app_dev_local@pgbouncer:5432/nominara
      VALKEY_CACHE_URL: redis://valkey-cache:6379
      # The QUEUE instance, and NEVER valkey-cache — system-architecture.md
      # §11 keeps the two apart. /health/ready reads queue depth, so without
      # this the readiness probe below can never answer.
      QUEUE_REDIS_URL: redis://valkey:6379
    ports:
      - "${API_PORT:-4000}:4000"
    command: ["node", "dist/src/main.js"]
    # STORY-120 — the healthcheck revisit its Definition of Done calls for.
    #
    # The IMAGE's HEALTHCHECK (Dockerfile) stays on /health/live and should:
    # Docker treats an unhealthy container as a restart signal, and readiness
    # legitimately says "not yet" while migrations are still landing —
    # restarting on that would turn a normal rolling deploy into a crash
    # loop.
    #
    # Compose is the opposite case. Nothing here restarts on unhealthy, so a
    # service healthcheck is purely a readiness GATE: it is what
    # `docker compose up --wait` and any `depends_on: service_healthy` block
    # on. Until STORY-120 that gate was liveness, which cannot tell anyone
    # the API is ready to serve — it reported healthy while /health/ready
    # answered 503, which it did in every environment. This override makes
    # the local gate mean what it claims.
    #
    # A real orchestrator wants BOTH probes pointed at their matching
    # endpoints (livenessProbe -> /health/live, readinessProbe ->
    # /health/ready). That belongs to the deployment manifests, which do not
    # exist in this repository yet (KAD-10, nominara-infra).
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6

  # STORY-043 review — src/worker.ts is the ONLY thing that executes queue
  # handlers, and until now nothing ran it: there was no npm script and no
  # compose service. That was invisible while the registry was empty (STORY-124
  # shipped the seam with zero handlers, so there was nothing to consume), and
  # it stopped being invisible the moment `crawl.discover` became real.
  #
  # Without this service a project is created, the job is enqueued, and
  # `discovery_status` stays `pending` forever — the wired flow would look MORE
  # broken than the fixture it replaced, and would look broken in a way that
  # points at the API rather than at the missing consumer.
  # ONE PROCESS PER WORKER GROUP, which is why this is `worker-crawl` and not
  # `worker`. src/worker.ts refuses to boot without WORKER_GROUP, and it is
  # right to: a group is the unit of concurrency and of blast radius, so a
  # single process draining all seven would let a slow crawl starve a rollup.
  #
  # Only the groups with a handler get a service. `crawl` has
  # `crawl.discover` (STORY-043), `capture` has `capture.execute`
  # (STORY-034), `parse` has `capture.parse` (STORY-135) and `rollup` has
  # `rollup.metric_daily` (STORY-042); the other three get theirs in the story
  # that lands their first handler — adding three idle services now would only
  # make three things to misread during an incident.
  worker-crawl:
    build: .
    image: nominara-api
    depends_on:
      dev-credentials:
        condition: service_completed_successfully
      valkey-cache:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      valkey:
        condition: service_started
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://nominara:nominara@postgres:5432/nominara
      DATABASE_URL_POOLED: postgres://nominara_app:nominara_app_dev_local@pgbouncer:5432/nominara
      VALKEY_CACHE_URL: redis://valkey-cache:6379
      QUEUE_REDIS_URL: redis://valkey:6379
      WORKER_GROUP: crawl
    # No ports, and the image's healthcheck DISABLED rather than merely
    # omitted. The Dockerfile bakes in `HEALTHCHECK ... /health/live`, which a
    # worker does not serve — so it inherits a probe that can only ever fail,
    # and the container sits permanently `unhealthy` while working perfectly.
    # An always-red health signal is worse than none: it trains an operator to
    # ignore the column.
    #
    # Real worker liveness is whether it is draining its queues, which needs a
    # queue-depth metric rather than a socket, and that belongs with the
    # deployment manifests (KAD-10) — not here.
    healthcheck:
      disable: true
    command: ["node", "dist/src/worker.js"]

  # STORY-034 — the group that drains `capture.execute`.
  #
  # WITHOUT THIS, A TRIGGERED RUN SITS AT `queued` FOREVER. The trigger plans
  # the cells and enqueues them; nothing local consumed them, so the whole
  # run-lifecycle surface looked broken in a way that points at the API rather
  # than at the missing consumer — the exact failure the comment above this
  # block describes for the crawl group.
  worker-capture:
    build: .
    image: nominara-api
    depends_on:
      dev-credentials:
        condition: service_completed_successfully
      valkey-cache:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      valkey:
        condition: service_started
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://nominara:nominara@postgres:5432/nominara
      DATABASE_URL_POOLED: postgres://nominara_app:nominara_app_dev_local@pgbouncer:5432/nominara
      VALKEY_CACHE_URL: redis://valkey-cache:6379
      QUEUE_REDIS_URL: redis://valkey:6379
      WORKER_GROUP: capture
    # Disabled for the same reason as worker-crawl's: the image bakes in a
    # `/health/live` probe that a worker does not serve, so it would sit
    # permanently `unhealthy` while working perfectly.
    healthcheck:
      disable: true
    command: ["node", "dist/src/worker.js"]

  # STORY-135 — the group that drains `capture.parse`.
  #
  # ITS OWN PROCESS, not folded into worker-capture, because a group is the
  # unit of concurrency and of blast radius. A parse resolves every citation
  # in an answer through the guarded fetcher, so it is network-bound and slow
  # in a way a capture is not; sharing a worker would let a run of
  # redirect-heavy answers starve the captures behind them.
  worker-parse:
    build: .
    image: nominara-api
    depends_on:
      dev-credentials:
        condition: service_completed_successfully
      valkey-cache:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      valkey:
        condition: service_started
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://nominara:nominara@postgres:5432/nominara
      DATABASE_URL_POOLED: postgres://nominara_app:nominara_app_dev_local@pgbouncer:5432/nominara
      VALKEY_CACHE_URL: redis://valkey-cache:6379
      QUEUE_REDIS_URL: redis://valkey:6379
      WORKER_GROUP: parse
    healthcheck:
      disable: true
    command: ["node", "dist/src/worker.js"]

  # STORY-042 — the group that drains `rollup.metric_daily`.
  #
  # Its own process for the same reason the others are: a rollup takes a
  # per-project advisory lock and holds it for the whole aggregation, so a
  # slow project blocks nothing but itself — but only if the group is not
  # also competing for the workers a capture needs.
  worker-rollup:
    build: .
    image: nominara-api
    depends_on:
      dev-credentials:
        condition: service_completed_successfully
      valkey-cache:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      valkey:
        condition: service_started
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://nominara:nominara@postgres:5432/nominara
      DATABASE_URL_POOLED: postgres://nominara_app:nominara_app_dev_local@pgbouncer:5432/nominara
      VALKEY_CACHE_URL: redis://valkey-cache:6379
      QUEUE_REDIS_URL: redis://valkey:6379
      WORKER_GROUP: rollup
    healthcheck:
      disable: true
    command: ["node", "dist/src/worker.js"]

  # STORY-100 AC5 — the group that drains `report.build`: a scheduled report's cadence path.
  #
  # Its own process, like the other groups. It also runs the report sweep (src/lib/reports/report-sweep.ts): an in-process
  # tick every 5 minutes, elected by an advisory lock, that enqueues one signed `report.build` job per report whose
  # `next_send_at` has come. It sends mail through the same EMAIL_SENDER path as every other group (`.env` carries the
  # Resend settings), so it needs the same environment as worker-rollup.
  worker-report:
    build: .
    image: nominara-api
    depends_on:
      dev-credentials:
        condition: service_completed_successfully
      valkey-cache:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      valkey:
        condition: service_started
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://nominara:nominara@postgres:5432/nominara
      DATABASE_URL_POOLED: postgres://nominara_app:nominara_app_dev_local@pgbouncer:5432/nominara
      VALKEY_CACHE_URL: redis://valkey-cache:6379
      QUEUE_REDIS_URL: redis://valkey:6379
      WORKER_GROUP: report
    healthcheck:
      disable: true
    command: ["node", "dist/src/worker.js"]

  gateway:
    build: .
    image: nominara-api
    depends_on:
      dev-credentials:
        condition: service_completed_successfully
      valkey-cache:
        condition: service_healthy
      # STORY-120 review — DATABASE_URL_POOLED points at pgbouncer, so this
      # service cannot reach its database without it, yet it did not depend
      # on it: `docker compose up -d api` left the pooler down and the API
      # answering nothing. It went unnoticed because the old liveness
      # healthcheck reported HEALTHY in exactly that state, which is this
      # story's whole point. `service_started` rather than `service_healthy`
      # because pgbouncer declares no healthcheck; the readiness probe below
      # is what actually verifies the connection works.
      pgbouncer:
        condition: service_started
      # Same gap, same cause: /health/ready reads queue depth, so the QUEUE
      # instance is a startup dependency of a service whose readiness gate
      # asks about it.
      valkey:
        condition: service_started
    env_file:
      - .env
    environment:
      NODE_ENV: development
      GATEWAY_PORT: "3001"
      DATABASE_URL: postgres://nominara:nominara@postgres:5432/nominara
      DATABASE_URL_POOLED: postgres://nominara_app:nominara_app_dev_local@pgbouncer:5432/nominara
      VALKEY_CACHE_URL: redis://valkey-cache:6379
      # The gateway opens no queue connection today. Overridden anyway: an
      # environment that carries a URL pointing at nothing is a trap for
      # whatever reads it next, and this file's own convention is that every
      # service corrects every connection URL.
      QUEUE_REDIS_URL: redis://valkey:6379
    ports:
      - "${GATEWAY_HOST_PORT:-3001}:3001"
    # A SEPARATE process from the API, matching the deployment topology's
    # standalone svc-gateway. It attaches the Valkey adapter, which is what
    # makes a broadcast cross instances — run more than one replica and they
    # still reach each other's sockets, with no sticky sessions.
    command: ["node", "dist/src/gateway.js"]
    # The gateway serves no HTTP routes by design, so it has no /health/live to
    # probe. Overriding the image's healthcheck avoids reporting a healthy
    # process as unhealthy.
    healthcheck:
      disable: true


volumes:
  nominara-postgres-data:
  nominara-valkey-data:
